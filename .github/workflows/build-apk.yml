name: Build Afifa Music APK

on:
  workflow_dispatch:
  push:
    branches: [ main, master ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Prepare Android SDK
        run: |
          export ANDROID_HOME=/usr/local/lib/android/sdk
          export ANDROID_SDK_ROOT=$ANDROID_HOME
          echo "ANDROID_HOME=$ANDROID_HOME" >> $GITHUB_ENV
          echo "ANDROID_SDK_ROOT=$ANDROID_HOME" >> $GITHUB_ENV
          echo "$ANDROID_HOME/cmdline-tools/latest/bin:$ANDROID_HOME/platform-tools" >> $GITHUB_PATH
          mkdir -p "$ANDROID_HOME/licenses"
          printf "8933bad161af4178b1185d1a37fbf41ea5269c55\nd56f5187479451eabf01fb78af6dfcb131a6481e\n24333f8a63b6825ea9c5514f83c2829b004d1fee\n" > "$ANDROID_HOME/licenses/android-sdk-license"
          sdkmanager --sdk_root="$ANDROID_HOME" --install "platform-tools" "platforms;android-34" "build-tools;34.0.0" || true

      - name: Create Android Project
        run: |
          rm -rf android-apk
          mkdir -p android-apk/app/src/main/java/com/afifa/music
          mkdir -p android-apk/app/src/main/res/layout
          mkdir -p android-apk/app/src/main/res/values
          mkdir -p android-apk/app/src/main/assets
          mkdir -p android-apk/gradle/wrapper

          if [ -f "index.html" ]; then
            cp index.html android-apk/app/src/main/assets/index.html
          elif [ -f "taharim.index.html" ]; then
            cp taharim.index.html android-apk/app/src/main/assets/index.html
          else
            echo "index.html not found in repository root"
            exit 1
          fi

          cat << 'EOF' > android-apk/gradle/wrapper/gradle-wrapper.properties
          distributionBase=GRADLE_USER_HOME
          distributionPath=wrapper/dists
          distributionUrl=https\://services.gradle.org/distributions/gradle-8.5-bin.zip
          networkTimeout=10000
          validateDistributionUrl=true
          zipStoreBase=GRADLE_USER_HOME
          zipStorePath=wrapper/dists
          EOF

          cat << 'EOF' > android-apk/gradlew
          #!/usr/bin/env sh
          exec java -jar "$APP_HOME/gradle/wrapper/gradle-wrapper.jar" "$@"
          EOF

          cat << 'EOF' > android-apk/settings.gradle
          rootProject.name = "AfifaMusic"
          include ':app'
          EOF

          cat << 'EOF' > android-apk/build.gradle
          buildscript {
            repositories {
              google()
              mavenCentral()
            }
            dependencies {
              classpath 'com.android.tools.build:gradle:8.2.2'
            }
          }
          allprojects {
            repositories {
              google()
              mavenCentral()
            }
          }
          EOF

          cat << 'EOF' > android-apk/app/build.gradle
          plugins {
            id 'com.android.application'
          }

          android {
            namespace 'com.afifa.music'
            compileSdk 34

            defaultConfig {
              applicationId "com.afifa.music"
              minSdk 23
              targetSdk 34
              versionCode 1
              versionName "1.0"
            }

            buildTypes {
              debug {
                minifyEnabled false
              }
            }

            compileOptions {
              sourceCompatibility JavaVersion.VERSION_17
              targetCompatibility JavaVersion.VERSION_17
            }
          }

          dependencies {
            implementation 'androidx.appcompat:appcompat:1.6.1'
          }
          EOF

          cat << 'EOF' > android-apk/app/src/main/res/values/strings.xml
          <resources>
            <string name="app_name">Afifa Music</string>
          </resources>
          EOF

          cat << 'EOF' > android-apk/app/src/main/res/layout/activity_main.xml
          <?xml version="1.0" encoding="utf-8"?>
          <WebView xmlns:android="http://schemas.android.com/apk/res/android"
              android:id="@+id/webview"
              android:layout_width="match_parent"
              android:layout_height="match_parent" />
          EOF

          cat << 'EOF' > android-apk/app/src/main/java/com/afifa/music/MainActivity.java
          package com.afifa.music;

          import android.annotation.SuppressLint;
          import android.app.Activity;
          import android.content.Intent;
          import android.net.Uri;
          import android.os.Bundle;
          import android.webkit.ValueCallback;
          import android.webkit.WebChromeClient;
          import android.webkit.WebSettings;
          import android.webkit.WebView;
          import android.webkit.WebViewClient;

          public class MainActivity extends Activity {
            private WebView webView;
            private ValueCallback<Uri[]> filePathCallback;

            @SuppressLint("SetJavaScriptEnabled")
            @Override
            protected void onCreate(Bundle savedInstanceState) {
              super.onCreate(savedInstanceState);
              setContentView(R.layout.activity_main);

              webView = findViewById(R.id.webview);
              WebSettings settings = webView.getSettings();
              settings.setJavaScriptEnabled(true);
              settings.setDomStorageEnabled(true);
              settings.setAllowFileAccess(true);
              settings.setAllowContentAccess(true);
              settings.setMediaPlaybackRequiresUserGesture(false);

              webView.setWebViewClient(new WebViewClient());
              webView.setWebChromeClient(new WebChromeClient() {
                @Override
                public boolean onShowFileChooser(WebView view, ValueCallback<Uri[]> cb, FileChooserParams params) {
                  if (filePathCallback != null) filePathCallback.onReceiveValue(null);
                  filePathCallback = cb;
                  try {
                    startActivityForResult(params.createIntent(), 1001);
                  } catch (Exception e) {
                    filePathCallback = null;
                    return false;
                  }
                  return true;
                }
              });

              webView.loadUrl("file:///android_asset/index.html");
            }

            @Override
            protected void onActivityResult(int requestCode, int resultCode, Intent data) {
              super.onActivityResult(requestCode, resultCode, data);
              if (requestCode == 1001 && filePathCallback != null) {
                filePathCallback.onReceiveValue(WebChromeClient.FileChooserParams.parseResult(resultCode, data));
                filePathCallback = null;
              }
            }
          }
          EOF

          cat << 'EOF' > android-apk/app/src/main/AndroidManifest.xml
          <?xml version="1.0" encoding="utf-8"?>
          <manifest xmlns:android="http://schemas.android.com/apk/res/android">
            <uses-permission android:name="android.permission.INTERNET" />
            <uses-permission android:name="android.permission.READ_EXTERNAL_STORAGE" />
            <uses-permission android:name="android.permission.READ_MEDIA_AUDIO" />
            <application
                android:label="@string/app_name"
                android:usesCleartextTraffic="true"
                android:theme="@android:style/Theme.DeviceDefault.NoActionBar">
              <activity android:name=".MainActivity" android:exported="true">
                <intent-filter>
                  <action android:name="android.intent.action.MAIN" />
                  <category android:name="android.intent.category.LAUNCHER" />
                </intent-filter>
              </activity>
            </application>
          </manifest>
          EOF

      - name: Build APK
        working-directory: android-apk
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Afifa-Music-APK
          path: android-apk/app/build/outputs/apk/debug/app-debug.apk
